sonar.projectKey=context-agent-ui
sonar.projectName=Context Agent UI
sonar.projectVersion=1.0.0

# Path to source directory
sonar.sources=src
sonar.exclusions=src/__tests__/**, src/setupTests.ts, vite.config.ts

# Path to test directory
sonar.tests=src/__tests__
sonar.test.inclusions=src/__tests__/**/*.test.tsx, src/__tests__/**/*.test.ts

# Encoding of the source files
sonar.sourceEncoding=UTF-8

# Test execution and coverage reports
sonar.javascript.lcov.reportPaths=coverage/lcov.info
